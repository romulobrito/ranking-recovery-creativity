# Configuracao unificada para pipeline de avaliacao de embeddings.
#
# Modo leve (padrao abaixo): results_dir "results", pipeline_extras desligados.
#
# Modo completo (todos os modelos + TF-IDF + CSV per-prompt + visualizacoes/bootstrap):
#   1) output.results_dir: use pasta dedicada, ex. "results/full_run_with_extras"
#   2) pipeline_extras.save_per_prompt_metrics: true
#   3) pipeline_extras.run_tfidf_baseline: true
#   4) pipeline_extras.run_visualizations: true
#   (run_visualizations exige save_per_prompt_metrics true; ajuste n_bootstrap se precisar)
#
# Sobrescrever saida sem editar YAML: python run_pipeline.py --output-dir <dir>
#
# Pacote Python: na raiz embedding_models_eval rode: pip install -e ".[viz]"
# (comando embedding-eval no PATH do venv). Sem instalar: PYTHONPATH=src python run_pipeline.py

# Configuracao do dataset
dataset:
  path: "saida_final.json"
  text_col: "extracted_idea_250"  # Coluna de texto para embedar
  truncate_content: 0  # 0 = sem truncamento

# Configuracao de embeddings
# Para adicionar um novo modelo, apenas adicione uma nova entrada em models
models:
  # ========================================================================
  # SENTENCE-TRANSFORMERS (Gratuitos, locais)
  # ========================================================================
  
  # Modelo rapido e leve (384D)
  - name: "minilm"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      batch_size: 32
      normalize: true
      device: "cpu"  # ou "cuda"
  
  # Versao maior do MiniLM (384D)
  - name: "minilm_l12"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-MiniLM-L12-v2"
      batch_size: 32
      normalize: true
      device: "cpu"
  
  # Modelo de alta qualidade (768D)
  - name: "mpnet_base"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-mpnet-base-v2"
      batch_size: 32
      normalize: true
      device: "cpu"
  
  # Multilingual (384D)
  - name: "multilingual"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      batch_size: 32
      normalize: true
      device: "cpu"
  
  # Otimizado para parafrases (384D)
  - name: "paraphrase_minilm"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/paraphrase-MiniLM-L6-v2"
      batch_size: 32
      normalize: true
      device: "cpu"
  
  # Otimizado para Q&A e similaridade (384D)
  - name: "multi_qa_minilm"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/multi-qa-MiniLM-L6-cos-v1"
      batch_size: 32
      normalize: true
      device: "cpu"
  
  # ========================================================================
  # OPENAI EMBEDDINGS (API, pago - requer OPENAI_API_KEY)
  # ========================================================================
  # A chave sera carregada automaticamente do .env via python-dotenv
  
  - name: "openai_small"
    provider: "openai"
    config:
      model_name: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY}"  # Carregado do .env automaticamente
      batch_size: 100
      normalize: true
      max_retries: 3
  
  - name: "openai_large"
    provider: "openai"
    config:
      model_name: "text-embedding-3-large"
      api_key: "${OPENAI_API_KEY}"  # Carregado do .env automaticamente
      batch_size: 100
      normalize: true
      max_retries: 3

# Configuracao de metricas
metrics:
  k_values: [1, 3, 5, 10]
  # Lista de metricas a calcular (podem ser adicionadas novas)
  metric_names:
    - "ir"      # Metricas classicas de IR
    - "votes"   # Metricas de votos no top-k

# Configuracao de ranking
ranking:
  group_cols: ["contest_number", "context_prompt_url"]
  rank_col: "rank_in_prompt"
  anchor_rank: 1  # Rank da ancora (top-1)

# Configuracao de saida
output:
  results_dir: "results"
  save_detailed: true  # Salvar DataFrame detalhado (parquet)
  # JSON detalhado pode ficar muito maior que Parquet; para API use o macro ou desligue.
  save_detailed_json: true  # true = tambem grava {modelo}_detalhado.json (alem do parquet)
  save_summary: true   # Salvar summary macro (CSV, JSON e Excel)
  save_summary_json: true  # Salvar comparacao macro em JSON (lista de registros)
  save_summary_excel: true  # Salvar summary tambem em Excel

# Etapas opcionais (aditivas; padrao false = mesmo comportamento de antes)
pipeline_extras:
  # CSVs {modelo}_metrics_per_prompt.csv (compativel com run_visualizations)
  save_per_prompt_metrics: false
  # Caminho relativo ao cwd ou absoluto; se null, usa results_dir + subdir abaixo
  per_prompt_metrics_dir: null
  per_prompt_metrics_subdir: "ranking_only"

  # Baseline TF-IDF (parquet + tfidf_metrics_per_prompt.csv + ranking_summary)
  run_tfidf_baseline: false
  tfidf_baseline_dir: null
  tfidf_baseline_subdir: "tfidf_baseline"

  # Boxplots, violin, bootstrap CI (exige save_per_prompt_metrics: true)
  run_visualizations: false
  visualizations_output_dir: null
  visualizations_subdir: "visualizations"
  # Se null, reutiliza os diretorios de export TF-IDF / per-prompt acima
  visualizations_ranking_dir: null
  visualizations_tfidf_dir: null
  n_bootstrap: 10000
