# H1 paper protocol: feasible_range_ratio for all 10 models (8 baseline + 2 new).

dataset:
  path: "saida_final.json"
  text_col: "extracted_idea_250"
  truncate_content: 0

models:
  - name: "all-mpnet-base-v2"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-mpnet-base-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "text-embedding-3-large"
    provider: "openai"
    config:
      model_name: "text-embedding-3-large"
      api_key: "${OPENAI_API_KEY}"
      batch_size: 100
      normalize: true
      max_retries: 3

  - name: "all-MiniLM-L12-v2"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-MiniLM-L12-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "all-MiniLM-L6-v2"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "text-embedding-3-small"
    provider: "openai"
    config:
      model_name: "text-embedding-3-small"
      api_key: "${OPENAI_API_KEY}"
      batch_size: 100
      normalize: true
      max_retries: 3

  - name: "multi-qa-MiniLM-L6-cos-v1"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/multi-qa-MiniLM-L6-cos-v1"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "paraphrase-MiniLM-L12-v2"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/paraphrase-MiniLM-L12-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "paraphrase-multilingual-MiniLM"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

  - name: "gemini-embedding"
    provider: "openai"
    config:
      model_name: "google/gemini-embedding-001"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      batch_size: 100
      normalize: true
      max_retries: 3

  - name: "qwen3-embedding-8b"
    provider: "openai"
    config:
      model_name: "qwen/qwen3-embedding-8b"
      api_key: "${OPENROUTER_API_KEY}"
      base_url: "https://openrouter.ai/api/v1"
      batch_size: 100
      normalize: true
      max_retries: 3

metrics:
  k_values: [1, 2, 3, 4, 5, 6, 7]
  metric_names:
    - "feasible_range_ratio"

ranking:
  group_cols: ["contest_number", "context_prompt_url"]
  rank_col: "rank_in_prompt"
  anchor_rank: 1

output:
  results_dir: "results/experimento2_h1_feasible_10models"
  save_detailed: true
  save_detailed_json: true
  save_summary: true
  save_summary_json: true
  save_summary_excel: true
  include_std_in_summary: true

pipeline_extras:
  save_per_prompt_metrics: false
  run_tfidf_baseline: false
  run_visualizations: false
