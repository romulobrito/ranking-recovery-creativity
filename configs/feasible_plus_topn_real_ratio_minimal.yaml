# Minimal additive config: feasible_range_ratio + topn_real_ratio.

dataset:
  path: "saida_final.json"
  text_col: "extracted_idea_250"
  truncate_content: 0

models:
  - name: "minilm"
    provider: "sentence_transformers"
    config:
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      batch_size: 32
      normalize: true
      device: "cpu"

metrics:
  k_values: [1, 2, 3, 4, 5, 6, 7]
  metric_names:
    - "feasible_range_ratio"
    - "topn_real_ratio"
  metric_params:
    topn_real_ratio:
      exclude_winner: true
      clip_0_1: true
      rank_gold_col: "rank_in_prompt"
      winner_rank_col: "rank_in_prompt"
      winner_rank_value: 1

ranking:
  group_cols: ["contest_number", "context_prompt_url"]
  rank_col: "rank_in_prompt"
  anchor_rank: 1

output:
  results_dir: "results/feasible_plus_topn_real_ratio_minilm"
  save_detailed: true
  save_detailed_json: false
  save_summary: true
  save_summary_json: true
  save_summary_excel: false

pipeline_extras:
  save_per_prompt_metrics: false
  run_tfidf_baseline: false
  run_visualizations: false

