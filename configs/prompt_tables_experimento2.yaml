  - hypothesis: H2
    model: text-embedding-3-large
    detailed_json: results/experimento2_h2/text-embedding-3-large/resultados_h2_detalhado.json
  - hypothesis: H2
    model: all-MiniLM-L12-v2
    detailed_json: results/experimento2_h2/all-MiniLM-L12-v2/resultados_h2_detalhado.json
  - hypothesis: H2
    model: all-MiniLM-L6-v2
    detailed_json: results/experimento2_h2/all-MiniLM-L6-v2/resultados_h2_detalhado.json
  - hypothesis: H2
    model: text-embedding-3-small
    detailed_json: results/experimento2_h2/text-embedding-3-small/resultados_h2_detalhado.json
  - hypothesis: H2
    model: multi-qa-MiniLM-L6-cos-v1
    detailed_json: results/experimento2_h2/multi-qa-MiniLM-L6-cos-v1/resultados_h2_detalhado.json
  - hypothesis: H2
    model: paraphrase-MiniLM-L12-v2
    detailed_json: results/experimento2_h2/paraphrase-MiniLM-L12-v2/resultados_h2_detalhado.json
  - hypothesis: H2
    model: paraphrase-multilingual-MiniLM
    detailed_json: results/experimento2_h2/paraphrase-multilingual-MiniLM/resultados_h2_detalhado.json
